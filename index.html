<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="KaamSetu — Discover verified local skilled workers near you. Book electricians, plumbers, tutors, tailors, cleaners and more with transparent pricing and portable reviews." />
  <title>KaamSetu — Local Skills. Trusted Nearby.</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom Tailwind config -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            teal: {
              50: '#f0fdfa', 100: '#ccfbf1', 200: '#99f6e4',
              300: '#5eead4', 400: '#2dd4bf', 500: '#14b8a6',
              600: '#0d9488', 700: '#0f766e', 800: '#115e59', 900: '#134e4a',
            },
            amber: {
              50: '#fffbeb', 100: '#fef3c7', 200: '#fde68a',
              300: '#fcd34d', 400: '#fbbf24', 500: '#f59e0b',
              600: '#d97706', 700: '#b45309', 800: '#92400e', 900: '#78350f',
            },
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            heading: ['Poppins', 'Inter', 'system-ui', 'sans-serif'],
          },
          animation: {
            'fade-in-up': 'fadeInUp 0.4s ease-out both',
            'fade-in': 'fadeIn 0.3s ease-out both',
            'shimmer': 'shimmer 1.5s infinite',
            'bounce-in': 'bounceIn 0.5s cubic-bezier(0.68,-0.55,0.265,1.55) both',
            'spin-slow': 'spin 3s linear infinite',
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(20px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            fadeIn: {
              '0%': { opacity: '0' },
              '100%': { opacity: '1' },
            },
            shimmer: {
              '0%': { backgroundPosition: '-200% 0' },
              '100%': { backgroundPosition: '200% 0' },
            },
            bounceIn: {
              '0%': { opacity: '0', transform: 'scale(0.3)' },
              '50%': { opacity: '1', transform: 'scale(1.05)' },
              '70%': { transform: 'scale(0.9)' },
              '100%': { opacity: '1', transform: 'scale(1)' },
            },
          },
        },
      },
    };
  </script>

  <!-- Main styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 font-sans antialiased transition-colors duration-300">
  <div id="root"></div>

  <!-- React 18 + Babel for JSX -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- App -->
  <script type="text/babel" src="app.js" data-presets="react"></script>
</body>
</html>
